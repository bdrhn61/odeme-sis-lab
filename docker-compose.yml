
services:

  order-postgres:
    image: postgres:17
    container_name: saga-order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${DB_USERNAME:-saga}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5440:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-postgres:
    image: postgres:17
    container_name: saga-payment-postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: ${DB_USERNAME:-saga}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5441:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d paymentdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-postgres:
    image: postgres:17
    container_name: saga-inventory-postgres
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: ${DB_USERNAME:-saga}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d inventorydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    container_name: saga-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  order-postgres-data:
  payment-postgres-data:
  inventory-postgres-data:
