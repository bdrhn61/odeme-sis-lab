filebeat.inputs:
  - type: filestream
    id: order-service-logs
    enabled: true
    paths:
      - /var/log/order-service/*.log

    parsers:
      - ndjson:
          target: ""
          add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "saga-logs"

setup.ilm.enabled: false
setup.template.enabled: false

logging.level: info